<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>UNM CS 512: Template</title>
  <!-- general styles to load from COMMON-->
  <link href="../../common/styles.css" rel="stylesheet" />
  <link href="../../common/navbar.css" rel="stylesheet" />
  <script defer src="../../common/navbar.js"></script>

  <!-- page specific files -->
  <!-- <link href="./public/.css" rel="stylesheet" /> -->
  <script defer src="../../dist/ray/bundle.js"></script>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-surface">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">UNM CS 512</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
        aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavDropdown">
        <ul class="navbar-nav">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownMenuLink" role="button"
              data-bs-toggle="dropdown" aria-expanded="false">
              Homework
            </a>
            <ul class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink" id="dropdown-homework"></ul>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownMenuLink" role="button"
              data-bs-toggle="dropdown" aria-expanded="false">
              Side Projects
            </a>
            <ul class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink" id="dropdown-projects"></ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <main>
    <h1>Example: Raytracing</h1>

    <p></p>
    <div id="demo">
      <div class="canvas-wrapper" style="display: flex; justify-content: center">
        <canvas id="glcanvas" width="800" height="450"></canvas>
        <div id="loader-wrapper">
          <div class="spinner"></div>
        </div>
      </div>

      <div class="controls">
        <label>
          Max Bounces
          <input class="uniform-slider" name="u_maxBounces" value="3" type="range" max="32" min="0" step="1"></input>
          <code id="u_maxBounces-value">3</code>
        </label>
        <label>
          Ambient Strength
          <input class="uniform-slider" name="u_ambientStrength" value="0.1" type="range" max="1" min="0"
            step="0.05"></input>
          <code id="u_ambientStrength-value">0.1</code>
        </label>
        <label>
          Ray Samples
          <input class="uniform-slider" name="u_raySamples" value="2" type="range" max="16" min="0" step="1"></input>
          <code id="u_raySamples-value">2</code>
        </label>
        <label>
          Shadow Layers
          <input class="uniform-slider" name="u_maxShadowLayers" value="8" type="range" max="16" min="0" step="1"></input>
          <code id="u_maxShadowLayers-value">8</code>
        </label>
        <label>
          Shadow TIR
          <input class="uniform-slider" name="u_tirShadow" type="checkbox"></input>
        </label>
        <label>
          Main Light Power
          <input id="lightPower" name="lightPower" value="3" type="range" max="20" min="0" step="1"></input>
          <code id="lightPower-value">3</code>
        </label>
        <label>
          Blue Glass IOR
          <input id="blueGlassIOR" name="blueGlassIOR" value="2.42" type="range" max="5" min="1.01" step="0.01"></input>
          <code id="blueGlassIOR-value">2.42</code>
        </label>

        <label>
          Glass Mode
          <select class="uniform-slider" name="u_glassMode">
            <option value="0">Dominant Branch</option>
            <option value="1">Contribution</option>
            <option value="2">Monte Carlo</option>
            <option value="3">Glass = Diffuse</option>
          </select>
        </label>
      </div>
    </div>

    <p>Controls and some things to try:</p>
    <ul>
      <li>
        Rotate the scene with your mouse and move with WS + the arrow keys.
      </li>
    </ul>
  </main>
</body>

</html>
